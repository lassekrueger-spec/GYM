<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#0e1014">
<title>Gym-Tracker</title>
<style>
:root{--bg:#0e1014;--card:#171a21;--card2:#20242d;--line:#2b303b;--text:#eef1f5;--mute:#8b94a5;--acc:#c8f560;--accInk:#151b05;--red:#ff6b6b;--gold:#ffd166;--doneBg:#243019}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 4px 10px;font-weight:700}
.sync{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--acc)}.dot.syncing{background:var(--gold)}.dot.error{background:var(--red)}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,20,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;max-width:130px;text-align:center;padding:9px 0 8px;color:var(--mute);text-decoration:none;font-size:11px;font-weight:600}
nav a svg{display:block;margin:0 auto 3px;width:24px;height:24px}
nav a.on{color:var(--acc)}
button{font:inherit;color:inherit;border:0;background:var(--card2);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--acc);color:var(--accInk)}
button.ghost{background:transparent;color:var(--mute);padding:8px 10px}
button.danger{color:var(--red)}
button.sm{padding:6px 10px;font-size:13px;border-radius:10px}
button.block{display:block;width:100%;padding:15px;font-size:16px}
button[data-armed]{background:var(--red);color:#fff}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input::placeholder{color:#5d6574}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.muted{color:var(--mute)}.sm{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:16px 16px;background:var(--card);border-radius:18px;margin-bottom:10px}
.plan-btn .name{font-size:20px;font-weight:800;letter-spacing:-.01em}
.plan-btn .meta{font-size:13px;color:var(--mute);font-weight:500;margin-top:2px}
.plan-btn .go{font-size:22px;color:var(--acc)}
.badge{display:inline-block;font-size:11px;font-weight:700;background:var(--acc);color:var(--accInk);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:3px}
.week .big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.bars{display:flex;gap:6px;margin-top:10px}
.bars i{flex:1;height:8px;border-radius:4px;background:var(--card2)}
.bars i.on{background:var(--acc)}
.ex-title{font-size:17px;font-weight:700}
.last{font-size:13px;color:var(--mute);margin:3px 0 12px}
.last b{color:var(--text);font-weight:600}
.grid{display:grid;grid-template-columns:26px 1fr 1fr 50px;gap:8px;align-items:center}
.set-head{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.set{margin-bottom:8px}
.set .n{color:var(--mute);font-weight:700;text-align:center}
.set input{text-align:center;height:44px;font-weight:600}
.set .chk{height:44px;padding:0;border-radius:10px;font-size:19px;color:var(--mute)}
.set.done input{background:var(--doneBg);border-color:transparent}
.set.done .chk{background:var(--acc);color:var(--accInk)}
.pr{color:var(--gold);font-size:12px;font-weight:700;margin:-2px 0 8px 34px}
.actions{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.hist-sets{font-size:14px;margin:6px 0}
.hist-sets div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.hist-sets div span:last-child{color:var(--mute);text-align:right}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
.plist .it{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.plist .it:first-child{border-top:0}
.plist .it .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:var(--card2);width:34px;height:34px;padding:0;border-radius:9px;font-size:15px;flex:none}
.lib-row{display:grid;grid-template-columns:1fr 112px 34px;gap:6px;margin-bottom:6px}
.info-card h3{margin:0 0 6px;font-size:17px;display:flex;gap:10px;align-items:center}
.info-card h3 span{font-size:22px}
.info-card p{margin:0;color:#c9ced8;line-height:1.5}
.info-card p+p{margin-top:8px}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-weight:600;margin:-4px 0 12px}
.radio-list{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border:2px solid transparent;background:var(--card2);font-weight:500}
.radio b{display:block;font-size:16px;margin-bottom:1px}
.radio .dot-r{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);flex:none;position:relative}
.radio.on{border-color:var(--acc)}
.radio.on .dot-r{border-color:var(--acc)}
.radio.on .dot-r::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acc)}
.goal-line{display:flex;align-items:center;gap:6px;color:var(--text);text-decoration:none;padding:2px 0 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{font-size:24px;min-width:24px;text-align:center}
.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--acc);margin:2px 0 4px}
.date-in{width:auto;padding:6px 8px;font-size:15px;background:transparent;border-color:var(--line)}
.bw-in{display:flex;align-items:center;gap:8px;margin-top:10px}
.bw-in input{width:92px;text-align:center;font-weight:600;padding:7px 8px}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{flex:1;padding:8px 0;font-size:13px;border-radius:10px;background:var(--card)}
.chip.on{background:var(--acc);color:var(--accInk)}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;font-size:13px;border-radius:9px;background:transparent;color:var(--mute)}
.seg button.on{background:var(--text);color:var(--bg)}
.kpi{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em}
.trend{font-weight:700;font-size:15px}
.up{color:var(--acc)}.down{color:var(--red)}.warn{color:var(--gold)}.flat{color:var(--mute)}
.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.chart text{fill:var(--mute);font-size:10px;font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.ex-list .r{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-radius:0;text-align:left;font-weight:500}
.ex-list .r:first-child{border-top:0}
.ex-list .r .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);min-width:62px;text-align:center}
.pill.up{background:#2a3a14}.pill.down{background:#3d1d1f}
.stat3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat3 b{display:block;font-size:18px;font-weight:800}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-top:10px}
.toggle input{-webkit-appearance:checkbox;appearance:auto;width:18px;height:18px;padding:0;margin:0;accent-color:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="supabase.js"></script>
<script>
"use strict";
const GROUPS=['Brust','Rücken','Schultern','Bizeps','Trizeps','Beine','Bauch','Cardio','Sonstiges'];
const LS_KEY='gymtracker_state_v1',LS_DIRTY='gymtracker_dirty_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseD=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmtW=n=>n==null?'–':String(Math.round(n*100)/100).replace('.',',');
const fmtInt=n=>Math.round(n).toLocaleString('de-DE');
const fmtDate=s=>parseD(s).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
function daysAgo(s){const d=Math.round((parseD(today())-parseD(s))/864e5);return d<=0?'heute':d===1?'gestern':`vor ${d} Tagen`}
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const setStr=s=>s.t!=null?`${s.l!=null?'Stufe '+fmtW(s.l)+' · ':''}${fmtW(s.t)} Min.`:s.w!=null?`${fmtW(s.w)}×${s.r}`:`${s.r} Wdh.`;
const fmtDur=m=>m==null?'':m>=60?`${Math.floor(m/60)} Std. ${m%60} Min.`:`${m} Min.`;

/* ---------- State ---------- */
function defaults(){
  const ex=[];const mk=(name,group)=>{const e={id:uid(),name,group};ex.push(e);return e.id};
  const push=[mk('Bankdrücken','Brust'),mk('Schrägbankdrücken (KH)','Brust'),mk('Schulterdrücken','Schultern'),mk('Seitheben','Schultern'),mk('Trizepsdrücken am Kabel','Trizeps')];
  const pull=[mk('Klimmzüge','Rücken'),mk('Langhantelrudern','Rücken'),mk('Latzug','Rücken'),mk('Face Pulls','Schultern'),mk('Bizepscurls','Bizeps')];
  const legs=[mk('Kniebeugen','Beine'),mk('Rumänisches Kreuzheben','Beine'),mk('Beinpresse','Beine'),mk('Beinbeuger','Beine'),mk('Wadenheben','Beine')];
  return{exercises:ex,plans:[{id:uid(),name:'Push',exerciseIds:push},{id:uid(),name:'Pull',exerciseIds:pull},{id:uid(),name:'Beine',exerciseIds:legs}],workouts:[],active:null,settings:{weeklyGoal:3},coreUpdatedAt:0};
}
function load(){try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s&&Array.isArray(s.exercises)&&Array.isArray(s.workouts))return s}catch(e){}return defaults()}
let S=load();
function applyCardio(){if(!S.settings.cardioAdded){if(!S.exercises.some(e=>e.group==='Cardio'))['Laufband','Crosstrainer','Fahrrad-Ergometer','Stepper','Rudergerät'].forEach(n=>S.exercises.push({id:uid(),name:n,group:'Cardio'}));S.settings.cardioAdded=true;try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}}
applyCardio();
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function touchCore(){S.coreUpdatedAt=Date.now();save();markDirty('core')}
function touchWorkout(w){w.updatedAt=Date.now();save();markDirty('w_'+w.id)}

const exById=id=>S.exercises.find(e=>e.id===id);
const planById=id=>S.plans.find(p=>p.id===id);
const exName=(id,fb)=>exById(id)?.name||fb||'Gelöschte Übung';
function workoutsSorted(){return S.workouts.filter(w=>!w.deleted).sort((a,b)=>b.date.localeCompare(a.date)||(b.finishedAt||0)-(a.finishedAt||0))}
const isCardio=exId=>exById(exId)?.group==='Cardio';
const defaultSets=exId=>{const l=lastFor(exId);return Array.from({length:l?l.sets.length:(isCardio(exId)?1:3)},()=>({w:'',r:'',done:false}))};
function lastFor(exId){for(const w of workoutsSorted()){const e=w.entries.find(e=>e.exId===exId);if(e&&e.sets.length)return{date:w.date,sets:e.sets}}return null}
function bestFor(exId){let m=null;for(const w of S.workouts){if(w.deleted)continue;for(const e of w.entries)if(e.exId===exId)for(const s of e.sets)if(s.w!=null&&(m==null||s.w>m))m=s.w}return m}
const volume=w=>w.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.w||0)*(s.r||0),0),0);
const cardioMin=w=>w.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.t||0),0),0);
const setCount=w=>w.entries.reduce((a,e)=>a+e.sets.length,0);

/* ---------- Speicherung: lokal + Konto (Supabase) ---------- */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const SB_URL='https://imrulxbbrpiizsqxzngu.supabase.co',SB_KEY='sb_publishable_PX5PnvXfZRTG0IM3PpjT4g_IRiUOhZI';
let sb=null,USER=null,syncState='local',flushing=false,flushTimer=null,recovery=false,authMsg='',lastSync=null;
let dirty=new Set((()=>{try{return JSON.parse(localStorage.getItem(LS_DIRTY))||[]}catch(e){return[]}})());
function persistDirty(){try{localStorage.setItem(LS_DIRTY,JSON.stringify([...dirty]))}catch(e){}}
function markDirty(k){dirty.add(k);persistDirty();scheduleFlush()}
function syncHTML(){if(!USER)return'';const t={local:'',syncing:'Speichert…',ok:'Gesichert',error:'Offline · lokal gespeichert'}[syncState]||'';return`<div class="sync" id="sync"><span class="dot ${syncState}"></span>${t}</div>`}
function setSync(st){syncState=st;if(st==='ok')lastSync=Date.now();const els=document.querySelectorAll('.sync');els.forEach(el=>el.outerHTML=syncHTML());const h=document.querySelector('header');if(USER&&h&&!h.querySelector('.sync'))h.insertAdjacentHTML('beforeend',syncHTML())}
function scheduleFlush(ms=900){if(!USER)return;clearTimeout(flushTimer);flushTimer=setTimeout(flush,ms)}
const coreData=()=>({exercises:S.exercises,plans:S.plans,active:S.active,settings:S.settings});
const wRow=w=>({user_id:USER.id,id:w.id,date:w.date,data:w,deleted:!!w.deleted,client_updated_at:w.updatedAt||0,duration_min:w.durationMin??null,volume_kg:Math.round(volume(w)),cardio_min:cardioMin(w),set_count:setCount(w),bodyweight:w.bodyweight??null});
async function flush(){
  if(!USER||flushing||!dirty.size)return;flushing=true;setSync('syncing');
  const keys=[...dirty];dirty.clear();persistDirty();let ok=true;
  try{
    if(keys.includes('core')){const{error}=await sb.from('user_state').upsert({user_id:USER.id,data:coreData(),client_updated_at:S.coreUpdatedAt||1});if(error)throw error}
    const ws=keys.filter(k=>k.startsWith('w_')).map(k=>S.workouts.find(w=>'w_'+w.id===k)).filter(Boolean);
    for(let i=0;i<ws.length;i+=200){const{error}=await sb.from('workouts').upsert(ws.slice(i,i+200).map(wRow));if(error)throw error}
  }catch(e){ok=false;keys.forEach(k=>dirty.add(k));persistDirty()}
  flushing=false;
  if(!ok){setSync('error');clearTimeout(flushTimer);flushTimer=setTimeout(flush,20000)}
  else if(dirty.size)scheduleFlush(300);else setSync('ok');
}
async function fetchAllWorkouts(){const out=[];for(let from=0;;from+=1000){const{data,error}=await sb.from('workouts').select('data,client_updated_at').order('id').range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)return out}}
let PROFILE=(()=>{try{return JSON.parse(localStorage.getItem('gymtracker_profile'))}catch(e){return null}})();
function saveProfileCache(){try{PROFILE?localStorage.setItem('gymtracker_profile',JSON.stringify(PROFILE)):localStorage.removeItem('gymtracker_profile')}catch(e){}}
async function loadProfile(){const{data,error}=await sb.from('profiles').select('display_name').maybeSingle();if(error)return;const n=data?.display_name||null;if((PROFILE?.name||null)!==n){PROFILE=n?{uid:USER.id,name:n}:null;saveProfileCache();const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(!typing)render()}}
async function saveName(){const el=document.getElementById('dispName');const n=(el?.value||'').trim().replace(/\s+/g,' ');
  if(!n){toast('Bitte einen Namen eingeben');return}if(n.length>30){toast('Maximal 30 Zeichen');return}
  const{error}=await sb.from('profiles').upsert({user_id:USER.id,display_name:n});if(error){toast(authErr(error));return}
  PROFILE={uid:USER.id,name:n};saveProfileCache();render();toast('Name gespeichert ✓')}
let pulling=false;
async function pull(){
  if(!USER||pulling)return;pulling=true;setSync('syncing');loadProfile();
  try{
    const[{data:st,error:e1},rws]=await Promise.all([sb.from('user_state').select('data,client_updated_at').maybeSingle(),fetchAllWorkouts()]);
    if(e1)throw e1;let changed=false;
    if(st&&st.data&&st.client_updated_at>(S.coreUpdatedAt||0)){const d=st.data;S.exercises=d.exercises||[];S.plans=d.plans||[];S.active=d.active||null;S.settings=d.settings||{weeklyGoal:3};S.coreUpdatedAt=st.client_updated_at;dirty.delete('core');changed=true}
    else if(!st||st.client_updated_at<(S.coreUpdatedAt||0))dirty.add('core');
    const seen=new Set();
    for(const r of rws){const v=r.data;if(!v||!v.id)continue;seen.add(v.id);v.updatedAt=r.client_updated_at;
      const i=S.workouts.findIndex(w=>w.id===v.id);
      if(i<0){S.workouts.push(v);changed=true}
      else if(r.client_updated_at>(S.workouts[i].updatedAt||0)){S.workouts[i]=v;dirty.delete('w_'+v.id);changed=true}
      else if(r.client_updated_at<(S.workouts[i].updatedAt||0))dirty.add('w_'+v.id)}
    for(const w of S.workouts)if(!seen.has(w.id)){if(!w.updatedAt)w.updatedAt=Date.now();dirty.add('w_'+w.id)}
    persistDirty();save();
    const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(changed&&!typing)render();
    pulling=false;if(dirty.size)flush();else setSync('ok');
  }catch(e){pulling=false;setSync('error')}
}
function authErr(e){const m=(e&&e.message||'').toLowerCase();
  if(m.includes('invalid login'))return'E-Mail oder Passwort falsch.';
  if(m.includes('not confirmed'))return'Bitte erst den Link in der Bestätigungs-Mail antippen.';
  if(m.includes('already registered')||m.includes('already been registered'))return'Für diese E-Mail gibt es schon ein Konto – melde dich an.';
  if(m.includes('password')&&(m.includes('6')||m.includes('short')||m.includes('weak')))return'Das Passwort muss mindestens 6 Zeichen haben.';
  if(m.includes('rate limit')||m.includes('too many'))return'Zu viele Versuche – bitte kurz warten.';
  if(m.includes('fetch')||m.includes('network'))return'Keine Verbindung zum Internet.';
  return'Hat nicht geklappt: '+(e&&e.message||'Unbekannter Fehler');}
function initSync(){
  if(!window.supabase||!window.supabase.createClient)return;
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
  const fromMail=/type=(signup|recovery|email)/.test(location.hash);

const redirectURL=()=>location.origin+location.pathname;
async function authAction(act){

      authMsg=data.session?'':'✓ Fast geschafft: Wir haben dir eine Mail geschickt. Tipp auf den Link darin und melde dich danach hier an.';render()}

const curTab=()=>{const h=location.hash.slice(1);return h==='info'||TABS.some(t=>t[0]===h)?h:'training'};


/* ---------- Statistik ---------- */
let statEx=null;
function lastBW(){for(const w of workoutsSorted())if(w.bodyweight!=null)return w.bodyweight;return null}
const e1rm=s=>s.w==null||!s.r||s.w<=0?null:(s.r===1?s.w:s.w*(1+s.r/30));
function exSeries(exId){
  const ws=workoutsSorted().slice().reverse();
  const cardio=ws.some(w=>w.entries.some(e=>e.exId===exId&&e.sets.some(s=>s.t!=null)));
  if(cardio){const points=[];for(const w of ws){const e=w.entries.find(e=>e.exId===exId);if(!e)continue;let l=null,t=0;for(const s of e.sets){if(s.l!=null&&(l==null||s.l>l))l=s.l;t+=s.t||0}if(l!=null||t)points.push({date:w.date,v:l??0,t})}return{cardio:true,weighted:false,points}}
  const weighted=ws.some(w=>w.entries.some(e=>e.exId===exId&&e.sets.some(s=>s.w!=null&&s.w>0)));
  const points=[];
  for(const w of ws){const e=w.entries.find(e=>e.exId===exId);if(!e)continue;let v=null;
    for(const s of e.sets){const x=weighted?e1rm(s):s.r;if(x!=null&&(v==null||x>v))v=x}
    if(v!=null)points.push({date:w.date,v})}
  return{weighted,points};
}
function bwSeries(){return workoutsSorted().slice().reverse().filter(w=>w.bodyweight!=null).map(w=>({date:w.date,v:w.bodyweight}))}
const RANGES=[['1m','1 Monat',1],['3m','3 Monate',3],['6m','6 Monate',6],['all','Alles',0]];
function cutoff(){const r=RANGES.find(r=>r[0]===(S.settings.statRange||'3m'))||RANGES[1];if(!r[2])return'';const d=new Date();d.setMonth(d.getMonth()-r[2]);return ymd(d)}
const inRange=pts=>{const c=cutoff();return pts.filter(p=>p.date>=c)};
function pct(pts){if(pts.length<2||!pts[0].v)return null;return(pts[pts.length-1].v-pts[0].v)/pts[0].v*100}
const fmtPct=p=>p==null?'–':(p>0?'▲ +':p<0?'▼ ':'')+p.toFixed(1).replace('.',',').replace('-','−')+' %';
const strengthCls=p=>p==null||Math.abs(p)<0.05?'flat':p>0?'up':'down';
function bwCls(p){if(p==null)return'flat';const g=S.settings.bwGoal||'gain';
  if(g==='hold')return Math.abs(p)<=1?'up':'warn';
  if(Math.abs(p)<0.05)return'flat';return(g==='gain'?p>0:p<0)?'up':'down'}
const CLR={up:'#c8f560',down:'#ff6b6b',warn:'#ffd166',flat:'#8b94a5'};
const GOALS=[['gain','📈','Zunehmen','Steigt dein Gewicht, wird das grün angezeigt.'],['hold','⚖️','Halten','Grün, solange du maximal ±1 % schwankst.'],['lose','📉','Abnehmen','Sinkt dein Gewicht, wird das grün angezeigt.']];
function goalRadio(){const g=S.settings.bwGoal||'gain';return`<div class="radio-list">${GOALS.map(([k,i,l,d])=>`<button class="radio ${g===k?'on':''}" data-act="bwgoal" data-v="${k}"><span class="dot-r"></span><span class="grow"><b>${i} ${l}</b><span class="muted sm">${d}</span></span></button>`).join('')}</div>`}
function goalLine(){const g=GOALS.find(x=>x[0]===(S.settings.bwGoal||'gain'));return`<a href="#mehr" class="goal-line"><span class="muted">Dein Ziel:</span> <b>${g[1]} ${g[2]}</b><span class="grow"></span><span class="muted sm">ändern ›</span></a>`}
function goalConflict(){const t=S.settings.bwTarget,st=bwSeries()[0]?.v,g=S.settings.bwGoal||'gain';if(t==null||st==null)return false;return(g==='gain'&&t<st)||(g==='lose'&&t>st)}
function goalWarn(){const t=S.settings.bwTarget,c=lastBW(),g=S.settings.bwGoal||'gain';if(t==null||c==null||!goalConflict())return'';
  if(g==='gain'&&t<c)return`<div class="sm warn" style="margin-top:8px">Dein Zielgewicht liegt unter deinem aktuellen Gewicht (${fmtW(c)} kg). Passt „Zunehmen“?</div>`;
  if(g==='lose'&&t>c)return`<div class="sm warn" style="margin-top:8px">Dein Zielgewicht liegt über deinem aktuellen Gewicht (${fmtW(c)} kg). Passt „Abnehmen“?</div>`;return''}
const fmtVal=(v,weighted=true,cardio=false)=>cardio?'Stufe '+fmtW(Math.round(v*10)/10):weighted?fmtW(Math.round(v*10)/10)+' kg':Math.round(v)+' Wdh.';
const shortD=s=>parseD(s).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
function chartSVG(series){
  const W=340,H=170,hasR=series.some(s=>s.axis==='r'),pL=34,pR=hasR?34:8,pT=8,pB=20;
  const all=series.flatMap(s=>s.points);if(!all.length)return'';
  const ts=all.map(p=>parseD(p.date).getTime());let x0=Math.min(...ts),x1=Math.max(...ts);if(x0===x1){x0-=3*864e5;x1+=3*864e5}
  const X=t=>pL+(t-x0)/(x1-x0)*(W-pL-pR);
  const dom=ax=>{const v=series.filter(s=>(s.axis||'l')===ax).flatMap(s=>s.points.map(p=>p.v));if(!v.length)return null;let a=Math.min(...v),b=Math.max(...v);const pad=Math.max((b-a)*.15,b*.02,1);return[a-pad,b+pad]};
  const D={l:dom('l'),r:dom('r')};const Y=(v,ax)=>{const[a,b]=D[ax];return pT+(1-(v-a)/(b-a))*(H-pT-pB)};
  let g='';const labF=ax=>v=>D[ax][1]-D[ax][0]<12?Math.round(v*10)/10:Math.round(v);
  for(let i=0;i<=3;i++){const y=pT+i*(H-pT-pB)/3;g+=`<line class="grid" x1="${pL}" x2="${W-pR}" y1="${y}" y2="${y}"/>`;
    if(D.l){const v=D.l[1]-i*(D.l[1]-D.l[0])/3;g+=`<text x="${pL-5}" y="${y+3}" text-anchor="end">${String(labF('l')(v)).replace('.',',')}</text>`}
    if(D.r){const v=D.r[1]-i*(D.r[1]-D.r[0])/3;g+=`<text x="${W-pR+5}" y="${y+3}">${String(labF('r')(v)).replace('.',',')}</text>`}}
  const d0=new Date(x0),d1=new Date(x1);g+=`<text x="${pL}" y="${H-4}">${shortD(ymd(d0))}</text><text x="${W-pR}" y="${H-4}" text-anchor="end">${shortD(ymd(d1))}</text>`;
  for(const s of series){if(!s.points.length)continue;const ax=s.axis||'l';
    const pts=s.points.map(p=>[X(parseD(p.date).getTime()),Y(p.v,ax)]);
    const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(!s.dashed&&pts.length>1)g+=`<path d="${path} L${pts[pts.length-1][0].toFixed(1)} ${H-pB} L${pts[0][0].toFixed(1)} ${H-pB} Z" fill="${s.color}" opacity=".08"/>`;
    g+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.dashed?1.6:2.4}" stroke-linejoin="round" stroke-linecap="round" ${s.dashed?'stroke-dasharray="4 4"':''}/>`;
    if(pts.length<=24)g+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.dashed?2:2.8}" fill="${s.color}"/>`).join('');
    const l=pts[pts.length-1];g+=`<circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="4.5" fill="${s.color}" stroke="#171a21" stroke-width="2"/>`}
  return`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function viewStatistik(){
  const ws=workoutsSorted();
  if(!ws.length)return`<div class="empty">Hier erscheinen deine Graphen,<br>sobald du ein paar Trainings gespeichert hast.</div>`;
  const rng=S.settings.statRange||'3m',c=cutoff();
  let h=`<div class="chips">${RANGES.map(([k,l])=>`<button class="chip ${k===rng?'on':''}" data-act="range" data-v="${k}">${l}</button>`).join('')}</div>`;
  // Übungen mit Daten
  const exs=[];const seen=new Set();
  for(const w of ws)for(const e of w.entries)if(!seen.has(e.exId)){seen.add(e.exId);const sr=exSeries(e.exId);if(sr.points.length)exs.push({id:e.exId,name:exName(e.exId,e.name),...sr,rp:inRange(sr.points)})}
  exs.forEach(x=>x.p=pct(x.rp));
  const withP=exs.filter(x=>x.p!=null&&!x.cardio);const avg=withP.length?withP.reduce((a,x)=>a+x.p,0)/withP.length:null;
  const wr=ws.filter(w=>w.date>=c);const weeks=Math.max(1,c?Math.round((parseD(today())-parseD(c))/(7*864e5)):Math.round((parseD(today())-parseD(ws[ws.length-1].date))/(7*864e5))+1);
  h+=`<div class="card stat3"><div><b class="${strengthCls(avg)}">${avg==null?'–':(avg>0?'+':'')+avg.toFixed(1).replace('.',',')+'%'}</b><span class="muted sm">Ø Kraft</span></div><div><b>${wr.length}</b><span class="muted sm">Trainings</span></div><div><b>${(wr.length/weeks).toFixed(1).replace('.',',')}</b><span class="muted sm">pro Woche</span></div><div><b>${(()=>{const d=wr.filter(w=>w.durationMin);return d.length?Math.round(d.reduce((a,w)=>a+w.durationMin,0)/d.length)+"'":"–"})()}</b><span class="muted sm">Ø Dauer</span></div></div>`;
  // Körpergewicht
  const bwAll=bwSeries(),bw=inRange(bwAll),bp=pct(bw),bc=bwCls(bp),cur=lastBW(),tgt=S.settings.bwTarget;
  h+=`<h2>Körpergewicht</h2><div class="card">${goalLine()}`;
  if(cur==null)h+=`<div class="muted sm" style="margin-top:12px">Trag beim nächsten Training dein Körpergewicht ein – dann siehst du hier den Verlauf.</div>`;
  else{
    h+=`<div class="kpi"><span class="v">${fmtW(cur)} kg</span><span class="trend ${bc}">${fmtPct(bp)}</span></div>`;
    if(bw.length>=2)h+=`<div class="muted sm">${fmtW(bw[0].v)} → ${fmtW(bw[bw.length-1].v)} kg im Zeitraum</div>`;
    if(tgt!=null&&goalConflict())h+=`<div class="sm warn" style="margin-top:4px">Zielgewicht ${fmtW(tgt)} kg passt nicht zu deinem Ziel – unter „ändern“ anpassen.</div>`;
    else if(tgt!=null){const diff=tgt-cur,g=S.settings.bwGoal||'gain';const done=g==='gain'?diff<=0:g==='lose'?diff>=0:Math.abs(diff)<0.5;
      h+=`<div class="sm" style="margin-top:4px">Ziel ${fmtW(tgt)} kg · ${done?'<span class="up">erreicht 🎉</span>':`noch ${diff>0?'+':'−'}${fmtW(Math.abs(Math.round(diff*10)/10))} kg`}</div>`}
    h+=bw.length?chartSVG([{points:bw,color:CLR[bc]}]):`<div class="muted sm" style="margin-top:8px">Keine Werte in diesem Zeitraum.</div>`;
  }
  h+=`</div>`;
  // Kraft
  h+=`<h2>Kraft & Cardio</h2>`;
  if(!exs.length)h+=`<div class="card muted sm">Noch keine Sätze gespeichert.</div>`;
  else{
    if(!statEx||!exs.some(x=>x.id===statEx))statEx=exs.slice().sort((a,b)=>b.points.length-a.points.length)[0].id;
    const x=exs.find(x=>x.id===statEx),cls=strengthCls(x.p),last=x.points[x.points.length-1].v,showBW=!x.cardio&&S.settings.showBW!==false&&bw.length>0;
    h+=`<div class="card"><select data-act="statex">${exs.map(e=>`<option value="${e.id}" ${e.id===statEx?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
    <div class="kpi"><span class="v">${fmtVal(last,x.weighted,x.cardio)}</span><span class="trend ${cls}">${fmtPct(x.p)}</span></div>
    <div class="muted sm">${x.cardio?`höchste Stufe · zuletzt ${fmtW(x.points[x.points.length-1].t)} Min.`:x.weighted?'geschätztes Maximum (1RM)':'max. Wiederholungen'}${x.rp.length>=2?` · ${fmtVal(x.rp[0].v,x.weighted,x.cardio)} → ${fmtVal(x.rp[x.rp.length-1].v,x.weighted,x.cardio)}`:''}</div>
    ${x.rp.length?chartSVG([{points:x.rp,color:CLR[cls],axis:'l'},...(x.cardio?[{points:x.rp.map(p=>({date:p.date,v:p.t})),color:'#7cc4ff',axis:'r',dashed:true}]:[]),...(showBW?[{points:bw,color:'#8b94a5',axis:'r',dashed:true}]:[])]):`<div class="muted sm" style="margin-top:8px">Keine Werte in diesem Zeitraum.</div>`}
    ${x.cardio&&x.rp.length?`<div class="legend"><span><i style="background:${CLR[cls]}"></i>Stufe (links)</span><span><i style="background:#7cc4ff"></i>Minuten (rechts)</span></div>`:''}
    ${showBW&&x.rp.length?`<div class="legend"><span><i style="background:${CLR[cls]}"></i>${x.weighted?'1RM (links)':'Wdh. (links)'}</span><span><i style="background:#8b94a5"></i>Körpergewicht (rechts)</span></div>`:''}
    ${bw.length&&!x.cardio?`<label class="toggle"><input type="checkbox" data-act="showbw" ${showBW?'checked':''}>Körpergewicht im Graph anzeigen</label>`:''}</div>`;
    h+=`<div class="card ex-list">${exs.slice().sort((a,b)=>(b.p??-1e9)-(a.p??-1e9)).map(e=>`<button class="r" data-act="selex" data-id="${e.id}"><span class="grow">${esc(e.name)}</span><span class="muted sm">${fmtVal(e.points[e.points.length-1].v,e.weighted,e.cardio)}</span><span class="pill ${strengthCls(e.p)}"><span class="${strengthCls(e.p)}">${e.p==null?'–':(e.p>0?'+':'')+e.p.toFixed(1).replace('.',',')+'%'}</span></span></button>`).join('')}</div>`;
    h+=`<div class="muted sm" style="padding:0 4px 8px">Das 1RM schätzt, was du einmal schaffen würdest (Gewicht × Wdh. umgerechnet). So sind z. B. 80 kg × 8 und 85 kg × 5 vergleichbar. Die Prozente vergleichen das erste mit dem letzten Training im gewählten Zeitraum.</div>`;
  }
  return h;
}

function placeholders(en){
  const last=lastFor(en.exId);const out=[];
  const c=isCardio(en.exId);
  en.sets.forEach((s,j)=>{const l=last?.sets[j];const prev=out[j-1],prevS=en.sets[j-1];
    const lw=l?(c?l.l:l.w):null,lr=l?(c?l.t:l.r):null;
    const w=lw!=null?fmtW(lw):prevS&&prevS.w!==''?prevS.w:prev?prev.w:'';
    const r=lr!=null?fmtW(lr):prevS&&prevS.r!==''?prevS.r:prev?prev.r:'';
    out.push({w,r})});
  return out;
}

/* ---------- Actions ---------- */
function startWorkout(planId){
  const p=planById(planId);
  const entries=(p?p.exerciseIds:[]).filter(exById).map(exId=>({exId,sets:defaultSets(exId)}));
  S.active={id:uid(),planId:p?p.id:null,date:today(),startedAt:Date.now(),entries};touchCore();render();window.scrollTo(0,0);
}
function finishWorkout(){
  const a=S.active,plan=planById(a.planId);
  const entries=a.entries.map(en=>{const c=isCardio(en.exId);return{exId:en.exId,name:exName(en.exId),cardio:c||undefined,sets:c?en.sets.map(s=>({l:num(s.w),t:num(s.r)})).filter(s=>s.t!=null&&s.t>0):en.sets.map(s=>({w:num(s.w),r:num(s.r)})).filter(s=>s.r!=null&&s.r>0)}}).filter(e=>e.sets.length);
  if(!entries.length){toast('Noch keine Sätze eingetragen');return}
  const bwv=num(a.bw);const w={id:a.id,planId:a.planId,planName:plan?plan.name:'Freies Training',date:a.date||today(),startedAt:a.startedAt,finishedAt:Date.now(),durationMin:a.date===today()?Math.max(1,Math.round((Date.now()-a.startedAt)/60000)):null,entries,bodyweight:bwv!=null&&bwv>20&&bwv<400?bwv:null};
  S.workouts.push(w);S.active=null;touchWorkout(w);touchCore();render();window.scrollTo(0,0);
  toast(`Gespeichert 💪 ${w.durationMin?fmtDur(w.durationMin)+' · ':''}${setCount(w)} ${setCount(w)===1?'Satz':'Sätze'}`);
}
function exportJSON(){return JSON.stringify({app:'gym-tracker',version:1,exportedAt:new Date().toISOString(),data:{exercises:S.exercises,plans:S.plans,workouts:S.workouts.filter(w=>!w.deleted),settings:S.settings}},null,1)}
async function doImport(){
  let txt=document.getElementById('impText').value.trim();const f=document.getElementById('impFile').files[0];
  if(!txt&&f)txt=await f.text();
  if(!txt){toast('Erst Datei wählen oder Text einfügen');return}
  let d;try{const j=JSON.parse(txt);d=j.data||j}catch(e){toast('Das ist kein gültiges Backup');return}
  if(!Array.isArray(d.exercises)||!Array.isArray(d.plans)||!Array.isArray(d.workouts)){toast('Das ist kein gültiges Backup');return}
  const now=Date.now(),ids=new Set(d.workouts.map(w=>w.id));
  for(const w of S.workouts)if(!ids.has(w.id)){w.deleted=true;w.updatedAt=now;dirty.add('w_'+w.id)}
  const old=S.workouts.filter(w=>w.deleted);
  S.exercises=d.exercises;S.plans=d.plans;S.settings=d.settings||{weeklyGoal:3};S.active=null;
  S.workouts=[...old,...d.workouts.map(w=>({...w,deleted:false,updatedAt:now}))];
  S.workouts.forEach(w=>dirty.add('w_'+w.id));touchCore();render();toast(`Importiert: ${d.workouts.length} Trainings`);
}
function move(arr,k,d){const t=k+d;if(t<0||t>=arr.length)return false;[arr[k],arr[t]]=[arr[t],arr[k]];return true}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT'||b.tagName==='TEXTAREA')return;
  if(b.dataset.confirm&&!b.dataset.armed){const t=b.textContent;b.dataset.armed='1';b.dataset.orig=t;b.textContent=t.length<3?'?':'Sicher?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.orig}},3000);return}
  const act=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j,id=b.dataset.id,a=S.active;
  switch(act){
    case'start':startWorkout(id);break;
    case'cancel':S.active=null;touchCore();render();toast('Training verworfen');break;
    case'finish':finishWorkout();break;
    case'check':{const en=a.entries[i],s=en.sets[j];
      if(!s.done){const ph=placeholders(en)[j];if(s.w==='')s.w=ph.w;if(s.r==='')s.r=ph.r;if(s.r===''){toast(isCardio(en.exId)?'Erst Minuten eintragen':'Erst Wiederholungen eintragen');return}}
      s.done=!s.done;touchCore();render();break}
    case'addset':{const en=a.entries[i],l=en.sets[en.sets.length-1];en.sets.push({w:l?l.w:'',r:'',done:false});touchCore();render();break}
    case'delset':a.entries[i].sets.pop();touchCore();render();break;
    case'rmex':a.entries.splice(i,1);touchCore();render();break;
    case'up':if(move(a.entries,i,-1)){touchCore();render()}break;
    case'down':if(move(a.entries,i,1)){touchCore();render()}break;
    case'delw':{const w=S.workouts.find(w=>w.id===id);if(w){w.deleted=true;touchWorkout(w);render();toast('Training gelöscht')}break}
    case'pup':case'pdown':{const p=planById(id);if(move(p.exerciseIds,+b.dataset.k,act==='pup'?-1:1)){touchCore();render()}break}
    case'prm':{const p=planById(id);p.exerciseIds.splice(+b.dataset.k,1);touchCore();render();break}
    case'delplan':S.plans=S.plans.filter(p=>p.id!==id);touchCore();render();break;
    case'newplan':S.plans.push({id:uid(),name:'Neuer Plan',exerciseIds:[]});touchCore();render();setTimeout(()=>{const ins=document.querySelectorAll('[data-act=pname]');const el=ins[ins.length-1];el&&(el.focus(),el.select())},50);break;
    case'newex':{const n=document.getElementById('newExName').value.trim();if(!n){toast('Name eingeben');return}
      if(S.exercises.some(e=>e.name.toLowerCase()===n.toLowerCase())){toast('Die Übung gibt es schon');return}
      S.exercises.push({id:uid(),name:n,group:document.getElementById('newExGroup').value});touchCore();render();toast(`„${n}“ angelegt`);break}
    case'delex':S.exercises=S.exercises.filter(e=>e.id!==id);S.plans.forEach(p=>p.exerciseIds=p.exerciseIds.filter(x=>x!==id));touchCore();render();break;
    case'bwgoal':S.settings.bwGoal=b.dataset.v;touchCore();render();break;
    case'range':S.settings.statRange=b.dataset.v;save();render();break;
    case'selex':statEx=b.dataset.id;render();window.scrollTo({top:0,behavior:'smooth'});break;
    case'goal':S.settings.weeklyGoal=Math.min(7,Math.max(1,(S.settings.weeklyGoal||3)+ +b.dataset.d));touchCore();render();break;
    case'copyexport':{const t=exportJSON();try{await navigator.clipboard.writeText(t);toast('Backup kopiert – z. B. in Notizen einfügen')}catch(e){exportText=t;render()}break}
    case'export':{const name=`gym-backup-${today()}.json`,blob=new Blob([exportJSON()],{type:'application/json'});
      try{const file=new File([blob],name,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Gym-Backup'});}
        else{const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
        S.settings.lastBackup=Date.now();save();render();toast('Backup erstellt')}
      catch(e){if(e&&e.name!=='AbortError')toast('Backup fehlgeschlagen')}break}
    case'import':doImport();break;
    case'login':case'signup':case'forgot':authAction(act);break;
    case'savename':saveName();break;
    case'syncnow':await pull();if(dirty.size)await flush();toast(syncState==='ok'?'Alles synchronisiert ✓':'Gerade keine Verbindung');break;
    case'logout':{try{await sb.auth.signOut()}catch(e){}USER=null;PROFILE=null;saveProfileCache();dirty.clear();persistDirty();S=defaults();S.settings.cardioAdded=false;applyCardio();save();authMsg='';render();toast('Abgemeldet');break}
    case'setpw':{const pw=document.getElementById('newPw').value;if(pw.length<6){authMsg='Mindestens 6 Zeichen.';render();break}
      const{error}=await sb.auth.updateUser({password:pw});if(error){authMsg=authErr(error);render();break}recovery=false;authMsg='';render();toast('Neues Passwort gespeichert ✓');break}
  }
});
document.addEventListener('input',ev=>{
  const el=ev.target,act=el.dataset.act;
  if(act==='w'||act==='r'){S.active.entries[+el.dataset.i].sets[+el.dataset.j][act]=el.value;touchCore()}
  if(act==='bw'){S.active.bw=el.value;touchCore()}
  if(act==='bwtarget'){S.settings.bwTarget=num(el.value);touchCore()}
});
document.addEventListener('change',ev=>{
  const el=ev.target,act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case'statex':statEx=el.value;render();break;
    case'showbw':S.settings.showBW=el.checked;save();render();break;
    case'bwtarget':render();break;
    case'dur':{const w=S.workouts.find(w=>w.id===id),v=num(el.value);if(w){w.durationMin=v!=null&&v>0?Math.round(v):null;touchWorkout(w)}break}
    case'adate':if(el.value){S.active.date=el.value;touchCore()}break;
    case'addex':if(el.value){S.active.entries.push({exId:el.value,sets:defaultSets(el.value)});touchCore();render()}break;
    case'padd':if(el.value){planById(id).exerciseIds.push(el.value);touchCore();render()}break;
    case'pname':{const v=el.value.trim();if(v){planById(id).name=v;touchCore()}else el.value=planById(id).name;break}
    case'exname':{const v=el.value.trim(),e=exById(id);if(v){e.name=v;touchCore()}else el.value=e.name;break}
    case'exgroup':exById(id).group=el.value;touchCore();render();break;
  }
});

function fmtTimer(){if(!S.active)return'';const sec=Math.max(0,Math.floor((Date.now()-S.active.startedAt)/1000)),h=Math.floor(sec/3600),m=Math.floor(sec/60)%60,x=sec%60;return(h?h+':'+pad(m):m)+':'+pad(x)}
setInterval(()=>{const t=document.getElementById('timer');if(t&&S.active)t.textContent=fmtTimer()},1000);
render();
document.addEventListener('submit',e=>{e.preventDefault();authAction('login')});
initSync();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
